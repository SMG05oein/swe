services:
  # 패스트에이피아이(FastAPI) 백엔드 서비스
  backend:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: cheonan_safety_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=cheonan-safety
      - FALLBACK_MODEL=qwen2.5:7b
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-admin-token}
    volumes:
      - ./Back/data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # 올라마(Ollama) 인공지능 추론 서비스
  ollama:
    image: ollama/ollama:latest
    container_name: cheonan_safety_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./Back/AI:/root/ai_models
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        pid=$$!
        echo "Waiting for Ollama service to start..."
        while ! /bin/ollama list > /dev/null 2>&1; do
          sleep 2
        done
        echo "Ollama service online. Checking models..."
        if ! /bin/ollama list | grep -q "cheonan-safety"; then
          if [ -f /root/ai_models/Qwen2.5-7B-Instruct.Q4_K_M.gguf ] && [ -f /root/ai_models/Modelfile ]; then
            echo "Registering cheonan-safety model from Modelfile..."
            cd /root/ai_models && /bin/ollama create cheonan-safety -f Modelfile
          else
            echo "Local GGUF not found. Pulling fallback model qwen2.5:7b..."
            /bin/ollama pull qwen2.5:7b
          fi
        else
          echo "cheonan-safety model already registered."
        fi
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "/bin/ollama list | grep -E 'cheonan-safety|qwen2.5' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# 올라마 모델 가중치 영구 보존용 볼륨
volumes:
  ollama_data:
